  - TestBytes: [3, 4, 3, 3]
  - Execute: [qs, -p, /usr/share/omarchy/shell, ipc, call, alebairos.mx-quick-control, externalEffect, "3"]

- Rule:
  - Feature: BACKLIGHT2
  - TestBytes: [3, 4, 4, 4]
  - Execute: [qs, -p, /usr/share/omarchy/shell, ipc, call, alebairos.mx-quick-control, externalEffect, "4"]

- Rule:
