  - Execute: [qs, -p, /usr/share/omarchy/shell, ipc, call, alebairos.mx-quick-control, externalEffect, "15"]
# Anything the tests above did not match -- an effect outside 0-15, or a
# device whose broadcast is shaped differently. Behaves as this file did
# before: the widget reads the device to find out what changed.
- Rule:
  - Feature: BACKLIGHT2
  - Execute: [qs, -p, /usr/share/omarchy/shell, ipc, call, alebairos.mx-quick-control, deviceChanged]
...
