name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Unit + functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci`: the suite uses node's built-in test runner and the
      # plugin itself has no JS dependencies at all. Nothing to install.
      - name: Run tests
        run: npm test

  manifest:
    name: Plugin manifest is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors the checks omarchy-plugin-validate performs, so a manifest
      # that the Omarchy shell would reject fails here instead of failing on
      # a user's machine at install time. Omarchy itself is not available on
      # a GitHub runner, hence the reimplementation rather than calling it.
      - name: Validate manifest.json
        run: |
          set -euo pipefail
          test -f manifest.json || { echo "manifest.json must be at the repo root"; exit 1; }
          jq -e . manifest.json >/dev/null
          jq -e '.schemaVersion == 1' manifest.json >/dev/null \
            || { echo "schemaVersion must be the number 1"; exit 1; }
          for field in id name version kinds entryPoints; do
            jq -e --arg f "$field" 'has($f)' manifest.json >/dev/null \
              || { echo "manifest missing required field: $field"; exit 1; }
          done
          id=$(jq -r '.id' manifest.json)
          [[ $id =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "invalid plugin id: $id"; exit 1; }
          [[ $id != omarchy.* ]] \
            || { echo "omarchy.* is reserved for first-party plugins"; exit 1; }
          jq -e '(.kinds | type) == "array" and (.kinds | length) > 0' manifest.json >/dev/null \
            || { echo "kinds must be a non-empty array"; exit 1; }
          # Every declared entry point must be a safe relative path that exists.
          while read -r entry; do
            case "$entry" in
              /*|*..*) echo "unsafe entry point path: $entry"; exit 1 ;;
            esac
            test -f "$entry" || { echo "entry point not found: $entry"; exit 1; }
          done < <(jq -r '.entryPoints[]' manifest.json)
          echo "manifest.json OK ($id)"

      - name: Repository ships only what a user needs
        run: |
          set -euo pipefail
          # `omarchy plugin add` does a full git clone into the user's
          # ~/.config/omarchy/plugins/, so everything here lands on their
          # machine. Plugins run unsandboxed and Omarchy asks users to review
          # the code before enabling it, so generic tooling that carries no
          # information about this project must not creep back in.
          fail=0
          for path in .specify .claude node_modules; do
            if [ -e "$path" ]; then
              echo "::error::$path is committed but ships to every user; keep it out (see .gitignore)"
              fail=1
            fi
          done
          # The docs a contributor or agent is pointed at must actually exist.
          for doc in README.md CONTRIBUTING.md AGENTS.md CHANGELOG.md SECURITY.md CODE_OF_CONDUCT.md specs/constitution.md; do
            test -f "$doc" || { echo "::error::missing $doc"; fail=1; }
          done
          exit $fail

      - name: No real device identifiers in fixtures
        run: |
          set -euo pipefail
          # Fixtures are captured from real hardware for realism, which makes
          # it easy to commit a receiver or device serial by accident. They
          # are not credentials, but they are hardware fingerprints with no
          # reason to be public. Placeholders are all A/B/0 runs; anything
          # else that looks like a Logitech serial fails the build.
          if grep -rnE "(Serial(\s+number)?\s*:|Unit ID:)\s*(?![AB0]+\b)[0-9A-F]{8,}" \
               tests/fixtures/ 2>/dev/null | grep -vE "[AB0]{8,}"; then
            echo "::error::a real-looking device serial is committed in tests/fixtures/"
            exit 1
          fi
          echo "fixtures carry no real device identifiers"

      - name: No broken unicode escapes in QML
        run: |
          set -euo pipefail
          # QML/JavaScript has no \U escape -- it wants \u{...} or the literal
          # character. Writing "\U000F0068" renders the codepoint as visible
          # text instead of a glyph, which shipped once already. Nerd Font
          # icons are astral-plane, so write the character itself.
          if grep -nP '\\U[0-9A-Fa-f]{4,8}' ./*.qml; then
            echo "::error::invalid \\U escape in QML; use the literal character"
            exit 1
          fi
          echo "no broken unicode escapes"

      - name: No emoji in shipped QML
        run: |
          set -euo pipefail
          # First-party Omarchy widgets use Nerd Font glyphs; emoji render in
          # another font, at another weight, and ignore the theme colour.
          if grep -qP '[\x{1F300}-\x{1FAFF}]' ./*.qml; then
            echo "emoji found in QML; use a Nerd Font glyph instead"
            grep -nP '[\x{1F300}-\x{1FAFF}]' ./*.qml
            exit 1
          fi
          echo "no emoji in QML"
